<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HA Failover Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Money Transfer: HA Failover</h1>
        <p class="sub" id="ns-info">Loading...</p>
      </div>
      <div class="badge-wrap">
        <span class="label">Active region</span>
        <span id="active-badge" class="badge">-</span>
        <span id="op-status" class="op-status"></span>
      </div>
    </header>

    <main>
      <section class="panel controls">
        <div class="control">
          <label for="count">Transfers</label>
          <input id="count" type="number" min="1" max="500" value="50" />
          <button id="start-btn">Start transfers</button>
          <span id="start-status" class="status"></span>
        </div>
        <div class="control">
          <button id="failover-btn" class="danger" disabled>Fail over</button>
          <span id="failover-status" class="status"></span>
        </div>
      </section>

      <section class="panel stats">
        <div class="stat">
          <span class="label">In flight</span>
          <span id="inflight" class="value">-</span>
          <span id="inflight-error" class="error"></span>
        </div>
        <div class="stat">
          <span class="label">Crossed regions <span class="hint">(last 10 min)</span></span>
          <a id="crossed" class="value" target="_blank" rel="noopener" title="Open these transfers in the Temporal Cloud UI">-</a>
          <span id="crossed-error" class="error"></span>
        </div>
        <div id="regions" class="regions"></div>
      </section>

      <section class="panel">
        <h2>Total steps per second (withdraw + deposit), by region</h2>
        <div class="chart-wrap"><canvas id="total-chart"></canvas></div>
        <p id="metrics-error" class="error"></p>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
